<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060e">
<meta name="description" content="Neon physics demolition. Drag to aim, release to fire, bring the whole structure down.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Overload &mdash; pi</title>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud">
    <div class="row">
      <div class="stat"><span class="label">SECTOR</span><span id="level">1</span></div>
      <div class="stat score"><span class="label">SCORE</span><span id="score">0</span></div>
      <div class="stat"><span class="label">CORES</span><span id="cores">0</span></div>
    </div>
    <div id="shots" class="shots"></div>
  </div>

  <div id="power"><div id="power-fill"></div></div>

  <div id="hint">DRAG TO AIM &middot; RELEASE TO FIRE</div>

  <div id="overlay">
    <div class="panel">
      <h1>OVERLOAD</h1>
      <p class="sub">Drag anywhere to aim.<br>Release to fire. Destroy every core.</p>
      <div class="cue">TAP TO BEGIN</div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
